
<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fraunces:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f5f4f0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 16px 64px;
  }

  .page {
    width: 100%;
    max-width: 480px;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
  }
  .topbar-logo {
    font-family: 'Fraunces', serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: #555;
  }
  .topbar-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #222;
  }

  /* Profile section */
  .profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 40px;
    text-align: center;
  }

  .avatar-wrap {
    position: relative;
    margin-bottom: 18px;
  }

  .avatar {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 32px;
    color: #f5f4f0;
    letter-spacing: -1px;
    overflow: hidden;
  }

  .avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .status-dot {
    position: absolute;
    bottom: 4px; right: 4px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #4ade80;
    border: 2.5px solid #f5f4f0;
  }

  .profile-name {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    color: #1a1a1a;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .profile-title {
    font-size: 13px;
    color: #777;
    font-weight: 400;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .profile-bio {
    font-size: 14px;
    color: #555;
    line-height: 1.65;
    max-width: 320px;
  }

  /* Divider */
  .divider {
    width: 40px;
    height: 1px;
    background: #ccc;
    margin: 28px auto;
  }

  /* Links section */
  .section-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 14px;
    padding-left: 2px;
  }

  .links-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: #fff;
    border: 0.5px solid #e0ddd5;
    border-radius: 14px;
    text-decoration: none;
    color: #1a1a1a;
    transition: border-color 0.18s, transform 0.15s;
    cursor: pointer;
  }

  .link-card:hover {
    border-color: #aaa;
    transform: translateY(-1px);
  }

  .link-card:active {
    transform: scale(0.99);
  }

  .link-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .link-icon svg { width: 20px; height: 20px; }

  .link-icon.instagram { background: #fef0f7; }
  .link-icon.whatsapp  { background: #edfbf3; }
  .link-icon.linkedin  { background: #eff5ff; }
  .link-icon.twitter   { background: #f2f2f2; }
  .link-icon.email     { background: #fff7ed; }
  .link-icon.website   { background: #f5f0ff; }

  .link-text { flex: 1; }
  .link-name {
    font-size: 14px;
    font-weight: 500;
    color: #1a1a1a;
    display: block;
  }
  .link-handle {
    font-size: 12px;
    color: #999;
    display: block;
    margin-top: 1px;
  }

  .link-arrow {
    color: #ccc;
    font-size: 16px;
    transition: color 0.15s;
  }
  .link-card:hover .link-arrow { color: #888; }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 44px;
    font-size: 11px;
    color: #bbb;
    letter-spacing: 0.05em;
  }
</style>
</head>
